name: 构建与测试

# 合并前拦一道:发布工作流只在打 tag 时跑,AOT 断裂/测试回归要等到发版才暴露,太晚。
# 步骤与 release.yml 同源(同一 profile、同一冒烟判据),区别是不建 Release、不传产物。

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Linux 适配(见 RePKG_Re.Cli/Helper/SystemInfo*.cs、ProcessorInfo.cs):JIT 构建 + 单元测试 + 冒烟。
  # 与 windows job 分离,因为 NativeAOT 只能在目标平台链接;Linux 侧两种形态都覆盖:JIT 的构建与测试,
  # 外加 linux-x64 的 AOT 发布与冒烟。
  build-test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 构建
        run: dotnet build RePKG_Re.sln -c Release --nologo -v:m

      - name: 单元测试
        run: dotnet test RePKG_Re.Tests/RePKG_Re.Tests.csproj -c Release --nologo -v:m

      - name: 冒烟 --help/--version
        run: |
          dll=RePKG_Re/bin/Release/net10.0/RePKG_Re.dll
          dotnet "$dll" --version
          dotnet "$dll" --help >/dev/null

      # Linux NativeAOT:与 Windows 侧同一判据(体积阈值 + --help 冒烟)。
      # 链接需 clang + zlib 头(clang 由 setup-dotnet 的依赖链提供,仍显式装一遍以防 runner 镜像变化)。
      - name: 发布 linux-x64 NativeAOT 并冒烟
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang zlib1g-dev
          dotnet publish RePKG_Re/RePKG_Re.csproj -c Release -p:PublishProfile=AotLinuxX64 --nologo -v:m
          exe=RePKG_Re/bin/publish-aot-linux/RePKG_Re
          test -f "$exe" || { echo "未找到 AOT 产物: $exe"; exit 1; }
          len=$(stat -c%s "$exe")
          # 阈值 5MB:框架依赖空壳约 0.16MB,空 console 的 AOT 地板约 0.9MB,本产物实测约 9MB
          [ "$len" -ge 5242880 ] || { echo "AOT 产物体积异常($len 字节 < 5MB),疑似退回框架依赖"; exit 1; }
          if ! "$exe" --help > /dev/null; then echo "--help 冒烟失败"; exit 1; fi
          echo "冒烟通过: $exe ($len 字节)"

  # Linux ARM64:GitHub 有原生 arm runner(ubuntu-24.04-arm,公开仓库可用),所以这个 job 是**在目标架构上
  # 构建并在目标架构上执行** —— 不需要交叉链接,也不需要"编出来却没法跑"这种半证。
  # 判据与 x64 两条一样(体积阈值 + --help),再加一条 gate 读数:内存闸必须读出非零 avail。这里不断言来源
  # 字面量,因为 Linux 侧合法值有三种(MemAvailable / sysinfo / cgroup 口径),而非零本身就排除了 "unavailable"。
  build-test-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 构建
        run: dotnet build RePKG_Re.sln -c Release --nologo -v:m

      - name: 单元测试
        run: dotnet test RePKG_Re.Tests/RePKG_Re.Tests.csproj -c Release --nologo -v:m

      - name: 发布 linux-arm64 NativeAOT 并冒烟
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang zlib1g-dev
          dotnet publish RePKG_Re/RePKG_Re.csproj -c Release -p:PublishProfile=AotLinuxArm64 --nologo -v:m
          exe=RePKG_Re/bin/publish-aot-linux-arm64/RePKG_Re
          test -f "$exe" || { echo "未找到 AOT 产物: $exe"; exit 1; }
          len=$(stat -c%s "$exe")
          [ "$len" -ge 5242880 ] || { echo "AOT 产物体积异常($len 字节 < 5MB),疑似退回框架依赖"; exit 1; }
          uname -m   # 把"这台 runner 真的是 aarch64"钉进日志,否则产物架构只能靠 profile 名推
          file "$exe" > /tmp/aot-file.txt; cat /tmp/aot-file.txt
          grep -qE 'ARM aarch64|aarch64' /tmp/aot-file.txt || { echo "产物不是 arm64 ELF: $(cat /tmp/aot-file.txt)"; exit 1; }
          if ! "$exe" --help > /dev/null; then echo "--help 冒烟失败"; exit 1; fi
          echo "冒烟通过: $exe ($len 字节)"

      # gate 行在动手拆包之前就打印,所以 input 指向不存在的路径也照样有读数。
      # 断言非零的理由与 mac 那条同:avail=0 会让内存闸每条 TEX 空等 100×20ms 后照样放行,静默退化。
      - name: 验 linux-arm64 内存采样口径
        run: |
          exe=RePKG_Re/bin/publish-aot-linux-arm64/RePKG_Re
          printf '{"wallpapers":[{"id":0,"input":"./no-such.pkg","output":"./gate-probe-out"}],"options":{"overwrite":true}}\n' > gate-probe.json
          "$exe" batch --manifest gate-probe.json --threads 1 >/dev/null 2>gate-probe.log || echo "batch 退出码 $? (与本判据无关,只核对读数)"
          cat gate-probe.log
          grep -qE 'avail=[1-9][0-9]*MB \(' gate-probe.log || { echo "linux-arm64 内存采样失败:gate 行不是 avail>0"; exit 1; }
          echo "内存采样通过:$(grep -oE 'avail=[0-9]+MB \([^)]*\)' gate-probe.log | head -1)"

  build-test:
    # NativeAOT 只能在目标平台链接(Windows 上产 win-x64 exe),不能用 ubuntu
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 构建
        run: dotnet build RePKG_Re.sln -c Release --nologo -v:m

      # TestTextures/ 语料(第三方壁纸素材)不入库:缺失的用例记为"跳过",其余照常断言
      - name: 单元测试
        run: dotnet test RePKG_Re.Tests/RePKG_Re.Tests.csproj -c Release --nologo -v:m

      - name: 发布 win-x64 NativeAOT 并冒烟
        shell: pwsh
        run: |
          dotnet publish RePKG_Re/RePKG_Re.csproj -c Release -p:PublishProfile=AotWinX64 --nologo -v:m
          $exe = "RePKG_Re/bin/publish-aot/RePKG_Re.exe"
          if (-not (Test-Path $exe)) { throw "未找到 AOT 产物: $exe" }
          $len = (Get-Item $exe).Length
          if ($len -lt 5MB) { throw "AOT exe 体积异常($len 字节 < 5MB),疑似退回框架依赖产物" }
          & $exe --help *> $null
          if ($LASTEXITCODE -ne 0) { throw "--help 冒烟失败 exit $LASTEXITCODE" }
          Write-Host "冒烟通过: $exe ($len 字节)"

  # macOS:runner 本身就是 Apple silicon,所以这里不只是"能编过",而是**第一次在真 mac 上执行**——
  # 内存采样(SystemInfo.MacOS.cs:总量/页大小走 sysctl、页计数走 Mach host_statistics64)与物理核口径
  # 在写进 README 之前,只有代码、没有读数。
  # 只出 osx-arm64:NativeAOT 不能交叉编译,而 GitHub 已无 Intel mac runner(macos-13 退役),
  # Intel Mac 用户走 JIT(dotnet RePKG_Re.dll),与本仓库 README 的平台口径一致。
  build-test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 构建
        run: dotnet build RePKG_Re.sln -c Release --nologo -v:m

      # mac 上的测试宿主曾经在本 job 第一次执行时原生崩溃("Test host process crashed",启动后 0.55 秒),
      # 而默认输出什么都不留:不知道卡在哪个用例、也没有栈。--blame-crash 让崩溃时留原生 dump,
      # --diag 把 vstest 自己的日志落到 /tmp/dotnet_support;两者只在失败时作为产物上传。
      - name: 单元测试
        run: >
          dotnet test RePKG_Re.Tests/RePKG_Re.Tests.csproj -c Release --nologo -v:m
          --blame-crash --diag:/tmp/dotnet_support/vstest.log

      - name: 上传测试崩溃证据
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-crash
          path: |
            /tmp/dotnet_support/**
            **/*.dmp
          if-no-files-found: ignore

      - name: 发布 osx-arm64 NativeAOT 并冒烟
        run: |
          dotnet publish RePKG_Re/RePKG_Re.csproj -c Release -p:PublishProfile=AotOsxArm64 --nologo -v:m
          exe=RePKG_Re/bin/publish-aot-osx/RePKG_Re
          test -f "$exe" || { echo "未找到 AOT 产物: $exe"; exit 1; }
          chmod +x "$exe"
          len=$(stat -f%z "$exe")
          # 阈值 5MB 同 win/linux(见那里注释);stat 用 BSD 语法,GNU 的 -c%s 在 mac 上直接报错
          [ "$len" -ge 5242880 ] || { echo "AOT 产物体积异常($len 字节 < 5MB),疑似退回框架依赖"; exit 1; }
          if ! "$exe" --help > /dev/null; then echo "--help 冒烟失败"; exit 1; fi
          echo "冒烟通过: $exe ($len 字节)"

      # 这条才是 macOS 适配的真正判据。批处理的 gate 行走 stderr(stdout 是 JSON 事件协议),
      # 且在动手拆包之前就打印,所以 input 指向不存在的路径也照样有读数(错误按事件上报)。
      # 断言 avail>0 的理由:AvailablePhysicalMacOS() 任一环节读不到就返回 0,0 会让内存闸
      # 每条 TEX 转换重试 100×20ms 后放行 —— 不崩、不报错,只是每条白等 2 秒。这种退化只能读数字看出来。
      # 来源串是 "sysctl+mach"(总量与页大小走 sysctl、页计数走 Mach host_statistics64);读不出来时
      # 它会变成 "sysctl+mach 失败:<哪一步> <errno/rc>",所以失败也自带定位信息。
      - name: 验 macOS 内存采样口径
        run: |
          exe=RePKG_Re/bin/publish-aot-osx/RePKG_Re
          printf '{"wallpapers":[{"id":0,"input":"./no-such.pkg","output":"./gate-probe-out"}],"options":{"overwrite":true}}\n' > gate-probe.json
          "$exe" batch --manifest gate-probe.json --threads 1 >/dev/null 2>gate-probe.log || echo "batch 退出码 $? (与本判据无关,只核对读数)"
          cat gate-probe.log
          grep -qE 'avail=[1-9][0-9]*MB \(sysctl\+mach\)' gate-probe.log || { echo "macOS 内存采样失败:gate 行不是 avail>0 (sysctl+mach)"; exit 1; }
          echo "内存采样通过:$(grep -oE 'avail=[0-9]+MB \(sysctl\+mach\)' gate-probe.log)"
