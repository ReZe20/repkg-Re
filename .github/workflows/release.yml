name: 发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '手动触发的版本号（如 v0.5.3），留空则用分支名'
        required: false
        default: ''
      notes:
        description: '版本介绍（可选）：填写则作为 Release 说明；留空则从 CHANGELOG.md 提取对应版本段落'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # Linux 产物必须在 Linux 上链接(NativeAOT 不能交叉编译),原先 release 只有 windows job,
  # 结果 README 宣称的 linux-x64 单文件从未出现在 Release 里 —— ci.yml 明明已经在构建它,
  # 只是从不发布。本 job 与 ci.yml 的 AotLinuxX64 步骤同源(publish + 体积阈值 + --help 冒烟),
  # 产出交给下面的 windows job 一起挂进 Release。
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 发布 linux-x64 NativeAOT（自包含单文件，免 .NET 运行时）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang zlib1g-dev
          dotnet publish RePKG_Re/RePKG_Re.csproj -c Release -p:PublishProfile=AotLinuxX64 --nologo -v:m

      # AOT 假成功防护与阈值来历同 ci.yml(见那里注释)。
      - name: 冒烟验证 AOT 产物可独立运行
        run: |
          exe=RePKG_Re/bin/publish-aot-linux/RePKG_Re
          test -f "$exe" || { echo "未找到 AOT 产物: $exe"; exit 1; }
          chmod +x "$exe"
          len=$(stat -c%s "$exe")
          [ "$len" -ge 5242880 ] || { echo "AOT 产物体积异常($len 字节 < 5MB),疑似退回框架依赖"; exit 1; }
          if ! "$exe" --help > /dev/null; then echo "--help 冒烟失败"; exit 1; fi
          echo "冒烟通过: $exe ($len 字节)"

      - name: 打包 tar.gz
        run: |
          ver="${INPUTS_VERSION:-$GITHUB_REF_NAME}"
          case "$ver" in v*) ;; *) ver=dev ;; esac
          tar -C RePKG_Re/bin/publish-aot-linux -czf "RePKG_Re-$ver-linux-x64.tar.gz" .
          echo "artifact_name=RePKG_Re-$ver-linux-x64.tar.gz" >> "$GITHUB_ENV"

        env:
          INPUTS_VERSION: ${{ inputs.version }}

      - name: 交给 release job
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: ${{ env.artifact_name }}

  build:
    needs: build-linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # NativeAOT 发布:AotWinX64 profile 固定 net10.0 + win-x64 + 自包含 + PublishAot,
      # 输出 bin/publish-aot/(与本地/WE Tool 构建同源)。产物 = RePKG_Re.exe(约 7.4MB) + THIRD-PARTY-NOTICES.txt,
      # pdb 已由 CopyOutputSymbolsToPublishDirectory=false 抑制(见 RePKG_Re.csproj 注释)。
      - name: 发布 win-x64 NativeAOT（自包含单 exe，免 .NET 运行时）
        run: dotnet publish RePKG_Re/RePKG_Re.csproj -c Release -p:PublishProfile=AotWinX64 --nologo -v:m

      # AOT 假成功防护:ILC 链接失败时 publish 仍可能 exit 0,但 exe 启动即崩(Costura 时代实测教训)。
      # 冒烟 --help 必须 exit 0;体积阈值 5MB 的来历:框架依赖空壳 exe 约 0.16MB,空 console 的 AOT 地板约 0.9MB,
      # 本产物去掉 Newtonsoft 依赖后实测 7.4MB(此前约 17MB,所以阈值不能沿用 10MB)。
      - name: 冒烟验证 AOT exe 可独立运行
        shell: pwsh
        run: |
          $exe = "RePKG_Re/bin/publish-aot/RePKG_Re.exe"
          if (-not (Test-Path $exe)) { throw "未找到 AOT 产物: $exe" }
          $len = (Get-Item $exe).Length
          if ($len -lt 5MB) { throw "AOT exe 体积异常($len 字节 < 5MB),疑似非 AOT 产物" }
          & $exe --help *> $null
          if ($LASTEXITCODE -ne 0) { throw "AOT exe --help 冒烟失败 exit $LASTEXITCODE" }
          Write-Host "冒烟通过: $exe ($len 字节),--help exit 0"

      - name: 下载 linux 产物
        uses: actions/download-artifact@v4
        with:
          name: linux-x64

      - name: 打包 zip 并生成版本介绍
        shell: pwsh
        run: |
          $ver = if ("${{ inputs.version }}") { "${{ inputs.version }}" } elseif ("${{ github.ref_name }}" -like "v*") { "${{ github.ref_name }}" } else { "dev" }
          Compress-Archive -Path "RePKG_Re/bin/publish-aot/*" -DestinationPath "RePKG_Re-$ver-win-x64.zip"
          echo "version=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

          # 版本介绍：手动输入的 notes 优先，其次 CHANGELOG.md 中当前版本的段落
          $body = ""
          if ("${{ inputs.notes }}") { $body = "${{ inputs.notes }}" }
          elseif (Test-Path "CHANGELOG.md") {
            $lines = Get-Content "CHANGELOG.md"
            $inSection = $false
            $section = @()
            foreach ($line in $lines) {
              if ($line -match "^## $ver($|\s)") { $inSection = $true; continue }
              if ($inSection -and $line -match "^## ") { break }
              if ($inSection) { $section += $line }
            }
            if ($section.Count -gt 0) { $body = ($section -join "`n").Trim() }
          }
          if ($body) {
            Set-Content -Path "release-body.md" -Value $body -Encoding UTF8
            echo "HAS_BODY=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            echo "HAS_BODY=false" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: 创建 Release（自定义版本介绍）
        if: env.HAS_BODY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.version }}
          body_path: release-body.md
          files: |
            RePKG_Re-${{ env.version }}-win-x64.zip
            RePKG_Re-${{ env.version }}-linux-x64.tar.gz

      - name: 创建 Release（自动生成介绍）
        if: env.HAS_BODY != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.version }}
          files: |
            RePKG_Re-${{ env.version }}-win-x64.zip
            RePKG_Re-${{ env.version }}-linux-x64.tar.gz
          generate_release_notes: true
